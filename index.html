        if (a >= 1e8) return (n / 1e8).toFixed(2) + ' 亿'
        if (a >= 1e4) return (n / 1e4).toFixed(2) + ' 万'
        return formatCNY(n)

      const valueAt = (cfg, when) => {
        const total = cfg.endDate.getTime() - cfg.startDate.getTime()
        if (total <= 0) return cfg.principal
        const elapsed = Math.min(Math.max(when.getTime() - cfg.startDate.getTime(), 0), total)
        return cfg.principal * (1 + (cfg.annualRate / 100) * (elapsed / MS_PER_DAY / 365))
      }

      /** 按真实时间流速驱动的模拟时钟（speed=1，单一静态演示） */
      function useWealthSimulation(cfg, running) {
        const [state, setState] = useState(() => {
          const start = Math.max(cfg.startDate.getTime(), Date.now())
          const now = new Date(start)
          return { virtualNow: now, currentValue: valueAt(cfg, now), matured: false }
        })

        const cfgRef = useRef(cfg)
        cfgRef.current = cfg

        useEffect(() => {
          const start = Math.max(cfg.startDate.getTime(), Date.now())
          const now = new Date(start)
          setState({ virtualNow: now, currentValue: valueAt(cfg, now), matured: false })
        }, [cfg])

        useEffect(() => {
          if (!running) return
          let raf = 0
          let last = performance.now()
          let virtual = Math.max(cfgRef.current.startDate.getTime(), Date.now())
          const tick = (t) => {
            const dtReal = (t - last) / 1000
            last = t
            virtual += dtReal * 1000
            const now = new Date(virtual)
            const c = cfgRef.current
            setState({
              virtualNow: now,
              currentValue: valueAt(c, now),
              matured: virtual >= c.endDate.getTime(),
            })
            raf = requestAnimationFrame(tick)
          }
          raf = requestAnimationFrame(tick)
          return () => cancelAnimationFrame(raf)
        }, [running, cfg])

        return state
      }

      function GrowthChart({ cfg, virtualNow }) {
        const span = cfg.endDate.getTime() - cfg.startDate.getTime()
        const n = 120
        const pts = []
        for (let i = 0; i <= n; i++) {
          const t = cfg.startDate.getTime() + (span * i) / n
          pts.push({ t, v: valueAt(cfg, new Date(t)), x: 0, y: 0 })
        }
        const minV = cfg.principal
        const maxV = valueAt(cfg, cfg.endDate)
        const range = Math.max(maxV - minV, 1e-6)
        const iw = CW - CPAD.left - CPAD.right
        const ih = CH - CPAD.top - CPAD.bottom
        for (const p of pts) {
          p.x = CPAD.left + ((p.t - cfg.startDate.getTime()) / span) * iw
          p.y = CPAD.top + (1 - (p.v - minV) / range) * ih
        }
        const mt = Math.min(Math.max(virtualNow.getTime(), cfg.startDate.getTime()), cfg.endDate.getTime())
        const mv = valueAt(cfg, new Date(mt))
        const marker = {
          x: CPAD.left + ((mt - cfg.startDate.getTime()) / span) * iw,
          y: CPAD.top + (1 - (mv - minV) / range) * ih,
          v: mv,
        }
        const line = pts.map((p, i) => `${i === 0 ? 'M' : 'L'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')
        const area = `${line} L${pts[pts.length - 1].x},${CH - CPAD.bottom} L${CPAD.left},${CH - CPAD.bottom} Z`
        const endV = maxV

            <button onClick=${onToggle} disabled=${!valid}
              class="flex w-full items-center justify-center gap-1.5 rounded-full bg-gradient-to-r from-[#e1251b] to-[#c81e15] py-2.5 text-[14px] font-medium text-white shadow-sm disabled:opacity-40">
              ${running ? html`<${Pause} size=${15} />` : html`<${Play} size=${15} />`}
              ${running ? '暂停演示' : '开始演示'}
            </button>
          </div>
        </section>`
      }

      function TabBar() {
        const tabs = [
          { key: 'home', label: '首页', active: true, dot: false, icon: html`<img src=${cmbMark} alt="首页" class="h-[26px] w-[26px]" draggable=${false} />` },
          { key: 'community', label: '社区', active: false, dot: true, icon: Compass({ size: 26, sw: 1.7 }) },
          { key: 'wealth', label: '财富', active: false, dot: false, icon: Gem({ size: 26, sw: 1.6 }) },
          { key: 'life', label: '生活', active: false, dot: false, icon: Bag({ size: 26, sw: 1.6 }) },
          { key: 'me', label: '我的', active: false, dot: true, icon: User({ size: 26, sw: 1.7 }) },
        ]
        return html`<nav class="sticky bottom-0 z-10 grid grid-cols-5 border-t border-[#eef0f3] bg-white pb-3 pt-2">
          ${tabs.map((t) => html`<button key=${t.key} class="relative flex flex-col items-center gap-0.5">
            <span class="relative">
              ${t.icon}
              ${t.dot && html`<span class="absolute -top-0.5 right-0 h-[7px] w-[7px] rounded-full bg-[#e1251b]"></span>`}
            </span>
            <span class=${'text-[11px] ' + (t.active ? 'font-semibold text-[#e1251b]' : 'text-[#4a4f5b]')}>${t.label}</span>
          </button>`)}
        </nav>`
      }

      /* ================= 应用入口 ================= */

      function Home() {
        const [cfg, setCfg] = useState(() => {
          const start = new Date()
          const end = new Date(start.getTime() + 365 * MS_PER_DAY)
          return { principal: 3609900, startDate: start, endDate: end, annualRate: 3.05 }
        })
        const [running, setRunning] = useState(true)
        const sim = useWealthSimulation(cfg, running)

        return html`<div class="mx-auto flex min-h-screen max-w-md flex-col bg-[#f6f7f9] shadow-xl">
          <div class="flex-1 bg-white">
            <${AppHeader} />
            <main class="pb-4">
              <${AssetCard} cfg=${cfg} sim=${sim} />
              <${QuickActions} />
              <${AccountList} currentValue=${sim.currentValue} />
              <${PromoBanner} />
              <${GrowthChart} cfg=${cfg} virtualNow=${sim.virtualNow} />
              <${SettingsPanel} cfg=${cfg} running=${running}
                onChange=${setCfg} onToggle=${() => setRunning((r) => !r)} />
              <p class="px-6 pt-4 pb-2 text-center text-[11px] leading-5 text-[#b6bcc8]">
                本页面为界面效果演示程序，计息方式按日单利（年化 ÷ 365）简化计算，与招商银行真实产品及收益无关，不构成任何投资建议。
              </p>
            </main>
          </div>
          <${TabBar} />
        </div>`
      }

      render(html`<${Home} />`, document.getElementById('root'))
    </script>
  </body>
</html>
